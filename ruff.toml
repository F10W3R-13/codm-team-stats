# ruff — 기본 오류 규칙만 활성화(E4/E7/E9 + F: pyflakes).
# 목적: 미사용 import(F401), 재정의(F811), 정의 안 된 이름(F821) 등 버그성 코드 검출.
# 스타일 규칙(전체 E/W)은 이 규모의 기존 코드베이스에 과하므로 의도적으로 제외.

target-version = "py311"
line-length = 120

[lint]
# 기본 오류 규칙으로 명시 고정 — 전역 ruff 설정(상위 디렉토리) 영향 차단.
select = ["E4", "E7", "E9", "F"]
# E402 제외: load_dotenv() 등을 import보다 먼저 실행하는 이 프로젝트의 관습.
# import 순서 재구조화는 리스크 대비 이득이 없다.
ignore = ["E402"]
