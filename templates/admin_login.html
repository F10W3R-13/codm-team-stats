{% extends "base.html" %}
{% block title %}{{ t.admin_login_title }} — CODM Stats{% endblock %}

{% block content %}
<div style="max-width:340px; margin:3rem auto;">
    <div class="card" style="padding:2rem;">
        <h1 style="font-size:1.4rem;">🔒 {{ t.admin_login_title }}</h1>
        <p class="muted" style="font-size:0.9rem; margin-bottom:1.5rem;">{{ t.admin_login_help }}</p>

        <form id="loginForm" onsubmit="return submitLogin(event)">
            <div style="margin-bottom:1rem;">
                <label class="muted" style="font-size:0.8rem;">{{ t.admin_password }}</label>
                <input type="password" name="password" id="pw" autocomplete="current-password"
                    style="width:100%; padding:0.7rem; border-radius:10px;" autofocus required>
            </div>
            <button type="submit"
                style="width:100%; padding:0.7rem; background:var(--accent); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:600;">
                {{ t.admin_login_btn }}
            </button>
        </form>
        <div id="err" style="color:#e74c3c; margin-top:0.8rem; font-size:0.9rem; min-height:1.2em;"></div>
    </div>
</div>

<script>
function submitLogin(e) {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const err = document.getElementById('err');
    err.textContent = '';
    fetch('/admin/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: pw}),
    }).then(r => r.json().then(d => ({status: r.status, data: d})))
      .then(({status, data}) => {
        if (data.ok) { window.location.href = data.redirect || '/admin'; }
        else { err.textContent = data.message || 'Error'; }
    }).catch(() => { err.textContent = 'Network error'; });
    return false;
}
</script>
{% endblock %}
