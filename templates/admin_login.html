{% extends "base.html" %}
{% block title %}{{ t.admin_login_title }} — CODM Stats{% endblock %}

{% block content %}
<div class="login-wrap">
    <div class="card login-card">
        <h1 class="login-title">🔒 {{ t.admin_login_title }}</h1>
        <p class="muted login-help">{{ t.admin_login_help }}</p>

        <form id="loginForm" onsubmit="return submitLogin(event)">
            <div class="login-field">
                <label class="muted login-label" for="pw">{{ t.admin_password }}</label>
                <input type="password" name="password" id="pw" class="input login-input" autocomplete="current-password" autofocus required>
            </div>
            <button type="submit" class="btn btn--primary login-btn">{{ t.admin_login_btn }}</button>
        </form>
        <div id="err" class="login-error"></div>
    </div>
</div>

<style>
.login-wrap { max-width: 340px; margin: 3rem auto; }
.login-card { padding: var(--space-8); }
.login-title { font-size: var(--fs-xl); }
.login-help { font-size: var(--fs-sm); margin-bottom: var(--space-6); }
.login-field { margin-bottom: var(--space-4); }
.login-label { font-size: var(--fs-xs); display: block; margin-bottom: var(--space-1); }
.login-input { width: 100%; }
.login-btn { width: 100%; }
.login-error { color: var(--danger); margin-top: var(--space-3); font-size: var(--fs-sm); min-height: 1.2em; }
</style>

<script>
function submitLogin(e) {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const err = document.getElementById('err');
    err.textContent = '';
    fetch('/admin/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: pw}),
    }).then(r => r.json().then(d => ({status: r.status, data: d})))
      .then(({status, data}) => {
        if (data.ok) { window.location.href = data.redirect || '/admin'; }
        else { err.textContent = data.message || 'Error'; }
    }).catch(() => { err.textContent = 'Network error'; });
    return false;
}
</script>
{% endblock %}
