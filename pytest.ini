[pytest]
# 루트 테스트와 tournament/tests는 같은 이름의 최상위 모듈(db, metrics 등)을
# 서로 다른 파일로 임포트한다 (tournament/_path_setup.py의 sys.path 핵).
# 한 프로세스에서 함께 실행하면 sys.modules 충돌로 양쪽이 다 깨지므로
# 기본 실행에서 tournament를 제외하고, tournament는 별도 프로세스로 실행한다:
#   pytest                      → 루트 스위트
#   pytest tournament/tests     → 토너먼트 스위트
# tests/의 테스트가 루트 모듈(db, metrics 등)을 임포트하므로 루트를 import 경로에 추가
pythonpath = .
addopts = --ignore=tournament
